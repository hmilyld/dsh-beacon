name: Release

# 打 v* 标签即发版：校验标签与 package.json 版本一致 → 构建并跑测试 →
# 用 Trusted Publishing（OIDC）发布到 npm，**不需要任何 token** →
# 把带预构建 lib/ 的 .tgz 作为 GitHub Release 附件发布。
#
# 为什么不用 NPM_TOKEN：npm 已在限制 bypass-2FA granular token
# （2026-07 起不能做账号/包管理，2027-01 起连 direct publish 也会取消），
# 长期方案就是 OIDC：https://docs.npmjs.com/trusted-publishers
#
# 一次性前提（npm 包设置页 → Trusted Publisher）：
#   Publisher: GitHub Actions | Organization: hmilyld
#   Repository: dsh-beacon     | Workflow filename: release.yml
#   Environment: 留空
#
# 安装端：
#   dsh plugin --profile <name> add @hmilyld/dsh-beacon
#   dsh plugin --profile <name> add github:hmilyld/dsh-beacon#v0.2.1
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # OIDC：trusted publishing + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 不设 registry-url：避免 setup-node 写出 _authToken=${NODE_AUTH_TOKEN}
      # 占位符，发布完全交给 OIDC（runner 默认 registry 就是 registry.npmjs.org）。
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Trusted Publishing 需要 npm >= 11.5.1（Node 22 自带的是 10.x）。
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Verify tag matches package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $expected"
            exit 1
          fi

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Smoke test
        run: npm test

      # OIDC 出问题时（例如 npm 侧没配 Trusted Publisher）先看这里：
      # 能确认 id-token 权限是否真的下发，避免误判成 npm 配置问题。
      - name: Print environment
        run: |
          echo "node: $(node --version)"
          echo "npm:  $(npm --version)"
          [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo "ID_TOKEN_REQUEST_URL: present" || echo "ID_TOKEN_REQUEST_URL: MISSING"
          [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo "ID_TOKEN_REQUEST_TOKEN: present" || echo "ID_TOKEN_REQUEST_TOKEN: MISSING"

      # prepare（构建 lib/）与 prepublishOnly（typecheck + 测试）会在这里再跑一遍。
      # OIDC 下 provenance 自动生成，无需 --provenance。
      # verbose 日志会打出 registry 拒绝交换时的具体原因。
      - name: Publish to npm (trusted publishing)
        env:
          NPM_CONFIG_LOGLEVEL: verbose
        run: npm publish --access public

      # npm pack 会先跑 prepare（tsc + esbuild），附件里因此带有 lib/。
      - name: Pack release artifact
        run: npm pack

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ./*.tgz \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
